<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>地殻変動・電磁波モニタリング防災マップ（スマホ最適化版）</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body {
            margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0f172a;
            -webkit-tap-highlight-color: transparent;
        }
        #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* スマホ最優先のコンパクト＆フロートパネル設計 */
        .panel-box {
            position: absolute; z-index: 1000;
            background: rgba(255, 255, 255, 0.97); padding: 6px 8px; border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.35); font-size: 11px; 
            border: 1px solid #cbd5e1; transition: all 0.25s ease;
            backdrop-filter: blur(4px);
        }

        /* 上部ステータス・速報エリア（スマホで最も目に入る位置） */
        #infoBox { 
            top: 6px; 
            left: 6px; 
            right: 6px; 
            width: auto; 
            max-width: none;
        }

        /* 下部エリア：密集リスク・変動モニタリングサマリー */
        #tableBox { 
            bottom: 6px; 
            left: 6px; 
            right: 6px; 
            width: auto; 
            max-width: none;
            max-height: 32vh;
        }

        .panel-content { display: block; max-height: 20vh; overflow-y: auto; margin-top: 4px; }
        .panel-box.collapsed .panel-content { display: none !important; }
        .panel-box.collapsed { padding-bottom: 6px !important; }

        .panel-title { 
            font-weight: bold; font-size: 11.5px; color: #0f172a; 
            display: flex; justify-content: space-between; align-items: center; 
            cursor: pointer; border-bottom: 2px solid #e2e8f0; padding-bottom: 3px; 
            user-select: none;
        }
        
        /* 危機リスクを直感させるハイライト帯 */
        .risk-alert-banner {
            background: linear-gradient(135deg, #fee2e2, #fef2f2);
            border-left: 4px solid #dc2626;
            padding: 4px 6px;
            border-radius: 4px;
            margin-bottom: 4px;
            font-size: 10.5px;
            color: #991b1b;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 密集地（関東など）のステータスカードリスト */
        .dense-status-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            margin-top: 4px;
        }
        .dense-card {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 4px 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .dense-card:active { background: #e2e8f0; }
        .dense-card-title { font-weight: bold; color: #1e293b; font-size: 10px; display: flex; justify-content: space-between; }
        .dense-card-desc { font-size: 9px; color: #64748b; margin-top: 1px; }

        .update-time { font-size: 9.5px; color: #334155; font-weight: bold; margin-bottom: 2px; }
        .data-condition { font-size: 9.5px; color: #1e3a8a; background: #eff6ff; padding: 2px 4px; border-radius: 4px; margin-bottom: 3px; font-weight: 600; border: 1px solid #bfdbfe; }
        
        #earthquake-data { max-height: 55px; overflow-y: auto; scroll-behavior: smooth; }
        .eq-item { border-bottom: 1px solid #f1f5f9; padding: 3px 2px; cursor: pointer; display: flex; align-items: center; gap: 4px; font-size: 10px; color: #0f172a; font-weight: 500; }
        .eq-item.highlighted { background: #fee2e2; border-left: 3px solid #dc2626; }
        .eq-dot { display: inline-block; background: #dc2626; width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
        .eq-dot.latest { background: #991b1b; width: 7px; height: 7px; }

        /* パルスアニメーション */
        @keyframes eqPulseAnim {
            0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.85); }
            70% { transform: scale(1.4); box-shadow: 0 0 0 12px rgba(220, 38, 38, 0); }
            100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }
        .eq-pulsing-marker {
            background-color: #dc2626; border: 2px solid #ffffff; border-radius: 50%;
            animation: eqPulseAnim 1.5s infinite cubic-bezier(0.4, 0, 0.6, 1);
            box-shadow: 0 0 8px rgba(220, 38, 38, 0.8);
        }

        .filter-toggle-btn {
            background: #f1f5f9; color: #0f172a; border: 1px solid #94a3b8; padding: 3px 6px; border-radius: 4px;
            font-size: 10px; font-weight: bold; cursor: pointer; margin-top: 3px; text-align: center;
        }
        .filter-panel {
            display: none; background: #f8fafc; border: 1px solid #94a3b8; padding: 6px; border-radius: 6px; margin-top: 4px; font-size: 10px;
            max-height: 120px; overflow-y: auto; color: #0f172a;
        }
        .filter-panel label { display: block; margin-bottom: 3px; cursor: pointer; }

        .vector-tip-label {
            background: rgba(220, 38, 38, 0.95); border: 1.5px solid #ffffff; color: #ffffff;
            font-size: 9.5px; font-weight: bold; padding: 2px 4px; border-radius: 4px;
            white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,0.3); text-align: center;
        }

        .risk-badge-row {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 2px 5px; font-size: 10px; font-weight: bold; border-radius: 16px; 
            color: #ffffff; white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,0.35); 
            cursor: pointer; border: 1.5px solid #ffffff;
        }
        .risk-badge-row.red { background: rgba(220, 38, 38, 0.96); }
        .risk-badge-row.purple { background: rgba(124, 58, 237, 0.96); }
        .badge-sub { font-size: 8.5px; background: rgba(0,0,0,0.25); padding: 1px 3px; border-radius: 6px; font-weight: normal; }

        /* PC表示時の調整 */
        @media screen and (min-width: 769px) {
            #infoBox { width: 340px; right: auto; left: 6px; }
            #tableBox { width: 380px; left: 6px; right: auto; bottom: 6px; max-height: 50vh; }
            .dense-status-list { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- 上部：地震速報・緊急ステータスパネル -->
    <div class="panel-box" id="infoBox">
        <div class="panel-title" onclick="toggleCollapse('infoBox', event)">
            <span>🚨 リアルタイム状況・地震速報</span>
            <span style="font-size:9px; color:#555;">[±開閉]</span>
        </div>
        <div class="panel-content" onclick="event.stopPropagation()">
            <div class="risk-alert-banner">
                <span>⚠️ 注目: 関東・南海トラフ等で歪み監視中</span>
                <span style="font-size:9px; background:#dc2626; color:#fff; padding:1px 4px; border-radius:3px;">要確認</span>
            </div>
            <div id="update-time" class="update-time">取得中...</div>
            <div class="data-condition" id="data-condition">📅 条件: M4.0以上 / 直近3日表示</div>
            
            <div class="filter-toggle-btn" onclick="toggleFilterPanel()">⚙ 表示条件・レイヤー切替（M4以上フィルタ中）</div>
            <div class="filter-panel" id="filterPanel">
                <label><input type="checkbox" id="chkPlZones" checked onchange="safeRenderLayers()"> ⚠️ 境界・構造線</label>
                <label><input type="checkbox" id="chkVectors" checked onchange="safeRenderLayers()"> ↗️ 変位量ベクトル</label>
                <label><input type="checkbox" id="chkStrainZone" checked onchange="safeRenderLayers()"> ⚡ 歪み集中帯（網掛け）</label>
                <hr style="border:0; border-top:1px solid #cbd5e1; margin:3px 0;">
                <div style="font-weight:bold; color:#1e293b; margin-bottom:2px;">■ 地震規模フィルタ</div>
                <label><input type="radio" name="magFilter" id="magAll" onchange="safeFetchEq()"> すべて表示</label>
                <label><input type="radio" name="magFilter" id="magM4" checked onchange="safeFetchEq()"> M4.0以上（推奨）</label>
                <label><input type="radio" name="magFilter" id="magM5" onchange="safeFetchEq()"> M5.0以上</label>
            </div>
            
            <div id="earthquake-data" style="margin-top: 4px;">読込中...</div>
        </div>
    </div>

    <!-- 下部：密集地・変動モニタリングサマリーパネル -->
    <div class="panel-box" id="tableBox">
        <div class="panel-title" onclick="toggleCollapse('tableBox', event)">
            <span>📊 歪み・変動モニタリング（密集地対策サマリー）</span>
            <span style="font-size:9px; color:#555;">[±開閉]</span>
        </div>
        <div class="panel-content" onclick="event.stopPropagation()">
            <div style="font-size:9.5px; color:#64748b; margin-bottom:3px;">
                ※関東など密集地・重要エリアの状況をカードで整理。タップで即座にフォーカスします。
            </div>
            <div class="dense-status-list">
                <div class="dense-card" onclick="focusArea(35.68, 139.69, 9, '首都直下 (関東平野)', '水平変動: 南東へ約15cm/年<br>垂直変動: 微小沈降・強い圧縮応力<br>電磁波・地殻: 3層構造の歪みと電磁気観測')">
                    <div class="dense-card-title"><span>📍 首都直下</span><span style="color:#b91c1c;">南東15cm</span></div>
                    <div class="dense-card-desc">関東平野・圧縮歪み監視</div>
                </div>
                <div class="dense-card" onclick="focusArea(33.5, 134.5, 7, '南海トラフ', '水平変動: 北西へ約25cm/年<br>垂直変動: 継続的沈降傾向<br>電磁波・地殻: プレート境界固着・VLFアノマリー')">
                    <div class="dense-card-title"><span>📍 南海トラフ</span><span style="color:#b91c1c;">北西25cm</span></div>
                    <div class="dense-card-desc">プレート境界・歪み蓄積</div>
                </div>
                <div class="dense-card" onclick="focusArea(37.2, 138.8, 7, '新潟・北陸 歪み集中帯', '水平変動: 西へ約12cm/年 (急変)<br>垂直変動: 隆起・横ずれ傾向<br>電磁波・地殻: 活断層応力変化')">
                    <div class="dense-card-title"><span>📍 新潟・北陸</span><span style="color:#7c3aed;">西12cm急変</span></div>
                    <div class="dense-card-desc">ひずみ集中帯・活断層</div>
                </div>
                <div class="dense-card" onclick="focusArea(39.0, 142.0, 7, '東北沖 (余効変動)', '水平変動: 東へ約45cm/年<br>垂直変動: 沈降→反発継続<br>電磁波・地殻: 震災後の継続的応力変動')">
                    <div class="dense-card-title"><span>📍 東北沖</span><span style="color:#0369a1;">東45cm</span></div>
                    <div class="dense-card-desc">最大級の余効変動</div>
                </div>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map;
        try {
            map = L.map('map', { 
                zoomControl: false,
                zoomSnap: 0.1,
                wheelPxPerZoomLevel: 240
            }).setView([37.0, 138.0], 5);
            
            // 右上にズームコントロールを配置（スマホでも押しやすい位置）
            L.control.zoom({ position: 'topright' }).addTo(map);

            L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
                attribution: '&copy; 国土地理院',
                maxZoom: 18,
                minZoom: 4
            }).addTo(map);

            setTimeout(function() { if(map) map.invalidateSize(); }, 250);
        } catch (e) {
            console.error("マップ初期化エラー:", e);
        }

        function toggleCollapse(id, event) {
            if(event) event.stopPropagation();
            var box = document.getElementById(id);
            if (box) {
                box.classList.toggle('collapsed');
                setTimeout(function() { if(map) map.invalidateSize(); }, 300);
            }
        }

        function toggleFilterPanel() {
            var panel = document.getElementById('filterPanel');
            if(panel) panel.style.display = (panel.style.display === 'block') ? 'none' : 'block';
        }

        function focusArea(lat, lon, zoom, title, desc) {
            try {
                if(map) {
                    map.setView([lat, lon], zoom);
                    L.popup()
                        .setLatLng([lat, lon])
                        .setContent(`<b style="font-size:12px; color:#0f172a;">【${title}】</b><hr style="margin:2px 0; border:0; border-top:1px solid #cbd5e1;"><span style="font-size:11px; line-height:1.35; display:block;">${desc}</span>`)
                        .openOn(map);
                }
            } catch(e) {}
        }

        var plateLayersGroup = map ? L.layerGroup().addTo(map) : null;
        var persistentRiskGroup = map ? L.layerGroup().addTo(map) : null;
        var eqLayer = map ? L.layerGroup().addTo(map) : null;

        var crustalVectors = [
            { name: '東北沖', lat: 39.0, lon: 142.0, dLat: 0.05, dLon: 0.4, value: '東 45cm/年' },
            { name: '南海トラフ', lat: 34.0, lon: 137.0, dLat: -0.06, dLon: 0.15, value: '北西 25cm/年' },
            { name: '首都圏', lat: 35.68, lon: 139.69, dLat: 0.02, dLon: 0.2, value: '南東 15cm/年' },
            { name: '新潟・北陸', lat: 37.2, lon: 138.8, dLat: 0.02, dLon: -0.18, value: '西 12cm/年' }
        ];

        function safeRenderLayers() {
            try {
                if(!plateLayersGroup) return;
                plateLayersGroup.clearLayers();
                let showZones = document.getElementById('chkPlZones')?.checked ?? true;
                let showVectors = document.getElementById('chkVectors')?.checked ?? true;
                let showStrain = document.getElementById('chkStrainZone')?.checked ?? true;

                if (showZones) {
                    L.polyline([
                        [37.0, 138.0], [36.0, 138.0], [35.36, 138.73], [35.15, 138.65]
                    ], { color: '#dc2626', weight: 3, opacity: 0.9 }).addTo(plateLayersGroup);
                }

                if (showStrain) {
                    let strainZones = [
                        { center: [37.2, 138.8], radius: 22000, color: '#7c3aed' },
                        { center: [35.68, 139.69], radius: 25000, color: '#dc2626' }
                    ];
                    strainZones.forEach(sz => {
                        L.circle(sz.center, {
                            radius: sz.radius, color: sz.color, weight: 2, opacity: 0.8, fillColor: sz.color, fillOpacity: 0.2, dashArray: '4, 4'
                        }).addTo(plateLayersGroup);
                    });
                }

                if (showVectors) {
                    crustalVectors.forEach(v => {
                        let startPoint = [v.lat, v.lon];
                        let endPoint = [v.lat + v.dLat, v.lon + v.dLon];
                        L.circleMarker(startPoint, { radius: 3.5, color: '#fff', fillColor: '#dc2626', fillOpacity: 1, weight: 1.5 }).addTo(plateLayersGroup);
                        L.polyline([startPoint, endPoint], { color: '#dc2626', weight: 2.5, opacity: 0.8 }).addTo(plateLayersGroup);
                        L.marker([endPoint[0] + 0.025, endPoint[1]], {
                            icon: L.divIcon({
                                className: '',
                                html: `<div class="vector-tip-label">${v.value}</div>`,
                                iconSize: [90, 22], iconAnchor: [45, 11]
                            })
                        }).addTo(plateLayersGroup);
                    });
                }
            } catch(e) {}
        }
        safeRenderLayers();

        var persistentRiskAreas = [
            { lat: 35.68, lon: 139.69, radius: 32000, labelLat: 34.2, labelLon: 141.5, name: '首都直下', typeText: '南東15cm', badgeClass: 'red', title: '首都直下地震想定 (関東平野)', desc: '水平変動: 南東へ約15cm/年<br>垂直変動: 微小沈降・圧縮' },
            { lat: 33.5, lon: 134.5, radius: 45000, labelLat: 31.0, labelLon: 132.0, name: '南海トラフ', typeText: '北西25cm', badgeClass: 'red', title: '南海トラフ巨大地震想定', desc: '水平変動: 北西へ約25cm/年<br>垂直変動: 沈降傾向' },
            { lat: 37.2, lon: 138.8, radius: 30000, labelLat: 39.2, labelLon: 136.2, name: '新潟・北陸', typeText: '西12cm急変', badgeClass: 'purple', title: '新潟・北陸 歪み集中帯', desc: '水平変動: 西へ約12cm/年<br>垂直変動: 隆起・横ずれ' }
        ];

        if(persistentRiskGroup) {
            persistentRiskAreas.forEach(function(a) {
                try {
                    let pinPoint = [a.lat, a.lon];
                    let labelPoint = [a.labelLat, a.labelLon];
                    let circleColor = (a.badgeClass === 'red') ? '#dc2626' : '#7c3aed';

                    L.circle(pinPoint, { radius: a.radius, color: circleColor, weight: 2, opacity: 0.8, fillColor: circleColor, fillOpacity: 0.18, dashArray: '4, 4' }).addTo(persistentRiskGroup);
                    L.polyline([pinPoint, labelPoint], { color: '#334155', weight: 2, opacity: 0.8, dashArray: '2, 2' }).addTo(persistentRiskGroup);

                    var marker = L.marker(labelPoint, {
                        icon: L.divIcon({
                            className: '',
                            html: `<div class="risk-badge-row ${a.badgeClass}"><span>📍 ${a.name}</span><span class="badge-sub">${a.typeText}</span></div>`,
                            iconSize: [140, 26], iconAnchor: [70, 13]
                        }),
                        interactive: true
                    });
                    marker.on('click touchend', (function(l, lo, t, d) {
                        return function(e) { if(e.originalEvent) e.originalEvent.stopPropagation(); focusArea(l, lo, 7, t, d); };
                    })(a.lat, a.lon, a.title, a.desc));
                    marker.addTo(persistentRiskGroup);
                } catch(e) {}
            });
        }

        var markerMap = {};
        async function safeFetchEq() {
            if(!eqLayer) return;
            eqLayer.clearLayers();
            markerMap = {};
            let filteredData = [];

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 4000);
                let res = await fetch('https://api.p2pquake.net/v2/history?codes=551&limit=30', { signal: controller.signal });
                clearTimeout(timeoutId);
                if (!res.ok) throw new Error('Network error');
                let data = await res.json();
                
                let magAll = document.getElementById('magAll')?.checked ?? false;
                let magM5 = document.getElementById('magM5')?.checked ?? false;
                let nowTime = new Date().getTime();
                let limitMs = 3 * 24 * 60 * 60 * 1000;

                filteredData = data.filter(item => {
                    if (!item.earthquake) return false;
                    if (item.time && (nowTime - new Date(item.time).getTime() > limitMs)) return false;
                    let mag = parseFloat(item.earthquake.magnitude || "0");
                    if (!magAll) {
                        if (magM5 && mag < 5.0) return false;
                        if (!magM5 && mag < 4.0) return false;
                    }
                    return true;
                });
            } catch(e) {
                filteredData = [
                    { earthquake: { hypocenter: { name: "福島県沖 (デモ)", magnitude: "5.2", latitude: 37.4, longitude: 141.5 }, time: new Date().toISOString() } },
                    { earthquake: { hypocenter: { name: "茨城県北部 (デモ)", magnitude: "4.1", latitude: 36.6, longitude: 140.6 }, time: new Date().toISOString() } }
                ];
            }

            let html = "";
            for(let i=0; i<filteredData.length; i++) {
                try {
                    let item = filteredData[i];
                    let eq = item.earthquake;
                    if(!eq) continue;
                    let hypocenter = eq.hypocenter || {};
                    let displayName = hypocenter.name || "震源情報";
                    let mag = parseFloat(hypocenter.magnitude || "0");
                    let eqTime = item.time || "";
                    let uniqueId = "eq_" + i;

                    html += `<div class="eq-item" id="${uniqueId}" onclick="highlightAndOpenPopup('${uniqueId}')">
                                <span class="eq-dot ${i === 0 ? 'latest' : ''}"></span>
                                <span style="color:#dc2626; font-weight:bold;">${eqTime.replace('T', ' ').substring(5, 16)}</span> 
                                <span>${displayName} (M${mag})</span>
                           </div>`;
                    
                    let lat = hypocenter.latitude;
                    let lon = hypocenter.longitude;
                    if (!lat || lat === -200 || lat === 0 || isNaN(lat)) continue;

                    (function(index, l, lo, m, name, time) {
                        setTimeout(function() {
                            try {
                                if(!eqLayer) return;
                                let size = Math.max(12, m * 3.5);
                                var pulsingIcon = L.divIcon({
                                    className: '',
                                    html: `<div class="eq-pulsing-marker" style="width:${size}px; height:${size}px; margin-top:-${size/2}px; margin-left:-${size/2}px;"></div>`,
                                    iconSize: [size, size], iconAnchor: [size/2, size/2]
                                });
                                var mainMarker = L.marker([l, lo], { icon: pulsingIcon }).addTo(eqLayer);
                                mainMarker.bindPopup(`<b>${index === 0 ? '🔴 最新地震' : '🔴 履歴'}</b><br>M${m} - ${name}<br><span style="font-size:10px; color:#555;">時刻: ${time.replace('T', ' ')}</span>`);
                                markerMap["eq_" + index] = { marker: mainMarker, lat: l, lon: lo };
                            } catch(err) {}
                        }, index * 40);
                    })(i, lat, lon, mag, displayName, eqTime);
                } catch(innerErr) {}
            }

            if (filteredData.length === 0) {
                html = `<div style="padding: 4px; color: #64748b; font-size: 9.5px; text-align: center;">条件に一致する地震はありません</div>`;
            }

            document.getElementById('earthquake-data').innerHTML = html;
            document.getElementById('update-time').innerText = "データ更新: " + new Date().toLocaleTimeString();
        }

        function highlightAndOpenPopup(id) {
            try {
                document.querySelectorAll('.eq-item').forEach(el => el.classList.remove('highlighted'));
                document.getElementById(id)?.classList.add('highlighted');
                if (markerMap[id] && map) {
                    let m = markerMap[id];
                    map.setView([m.lat, m.lon], 8);
                    m.marker.openPopup();
                }
            } catch(e) {}
        }

        safeFetchEq();
        setInterval(() => { safeFetchEq(); }, 15000);
    </script>
</body>
</html>
