<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>地殻変動・歪み集中・リアルタイム防災マップ（パネル拡大縮小機能付き）</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body {
            margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #e2e8f0;
        }
        #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* 四隅パネル共通の基本スタイル＆拡大クラス */
        .risk-table-box {
            position: absolute; top: 14px; left: 14px; z-index: 1000;
            background: rgba(255, 255, 255, 0.98); padding: 12px 14px; border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.35); font-size: 13px; width: 345px;
            pointer-events: auto; max-height: 52vh; overflow-y: auto;
            border: 1px solid #cbd5e1; transition: all 0.25s ease;
        }
        .risk-table-box.expanded {
            width: 80vw; max-width: 600px; max-height: 85vh; top: 20px; left: 20px; z-index: 2000; font-size: 15px;
        }

        .risk-table-title { font-weight: bold; margin-bottom: 6px; border-bottom: 2px solid #cbd5e1; padding-bottom: 5px; font-size: 14px; color: #0f172a; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .risk-table-box.expanded .risk-table-title { font-size: 17px; }
        .risk-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .risk-table th, .risk-table td { text-align: left; padding: 5px 4px; border-bottom: 1px solid #e2e8f0; font-size: 12px; color: #1e293b; overflow: hidden; text-overflow: ellipsis; }
        .risk-table-box.expanded .risk-table th, .risk-table-box.expanded .risk-table td { font-size: 14px; padding: 8px; }
        .risk-table th { font-weight: bold; color: #0f172a; }

        .circle-legend-note {
            margin-top: 10px; background: #f1f5f9; border: 1px solid #94a3b8; padding: 8px; border-radius: 6px; font-size: 11.5px; color: #0f172a; line-height: 1.45; font-weight: 500;
        }
        .risk-table-box.expanded .circle-legend-note { font-size: 13.5px; padding: 12px; }
        .circle-legend-note b { color: #1e3a8a; display: block; margin-bottom: 3px; font-size: 12px; }
        .risk-table-box.expanded .circle-legend-note b { font-size: 14px; }

        .info-box {
            position: absolute; top: 14px; right: 14px; z-index: 1000;
            background: rgba(255, 255, 255, 0.98); padding: 12px 14px; border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.35); width: 285px; font-size: 13px;
            pointer-events: auto; max-height: 50vh; display: flex; flex-direction: column;
            border: 1px solid #cbd5e1; transition: all 0.25s ease;
        }
        .info-box.expanded {
            width: 80vw; max-width: 550px; max-height: 85vh; top: 20px; right: 20px; z-index: 2000; font-size: 15px;
        }
        .info-box h3 { margin: 0 0 6px 0; font-size: 14px; color: #0f172a; display: flex; justify-content: space-between; align-items: center; font-weight: bold; cursor: pointer; }
        .info-box.expanded h3 { font-size: 17px; }
        .update-time { font-size: 12px; color: #334155; margin-bottom: 6px; border-bottom: 1px solid #cbd5e1; padding-bottom: 3px; font-weight: bold; }
        .info-box.expanded .update-time { font-size: 14px; }
        
        #earthquake-data { max-height: 130px; overflow-y: auto; scroll-behavior: smooth; padding-right: 2px; }
        .info-box.expanded #earthquake-data { max-height: 350px; }
        .eq-item { border-bottom: 1px solid #e2e8f0; padding: 6px 4px; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; gap: 6px; font-size: 12px; color: #0f172a; font-weight: 500; }
        .info-box.expanded .eq-item { font-size: 14px; padding: 10px 6px; }
        .eq-item:hover { background: #f1f5f9; }
        .eq-item.highlighted { background: #fee2e2; border-left: 3px solid #dc2626; padding-left: 6px; }
        .eq-dot { display: inline-block; background: #0284c7; width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .eq-dot.latest { background: #dc2626; width: 12px; height: 12px; }
        
        .filter-toggle-btn {
            background: #e0f2fe; color: #0369a1; border: 1px solid #7dd3fc; padding: 6px 10px; border-radius: 6px;
            font-size: 12px; font-weight: bold; cursor: pointer; margin-top: 6px; display: inline-block; width: 100%; text-align: center; box-sizing: border-box;
        }
        .filter-panel {
            display: none; background: #f8fafc; border: 1px solid #94a3b8; padding: 8px; border-radius: 6px; margin-top: 6px; font-size: 12px;
            max-height: 150px; overflow-y: auto; color: #0f172a; font-weight: 500;
        }
        .filter-panel label { display: block; margin-bottom: 5px; cursor: pointer; }
        
        .wave-alert { margin-top: 6px; background: #e0f2fe; padding: 6px 10px; border-radius: 6px; color: #0369a1; font-weight: bold; font-size: 11.5px; border-left: 3px solid #0284c7; }
        .noise-filter-status { margin-top: 5px; background: #f1f5f9; padding: 6px 10px; border-radius: 6px; color: #334155; font-size: 11.5px; font-weight: bold; border: 1px solid #cbd5e1; }

        .risk-explain-box {
            position: absolute; bottom: 15px; right: 14px; z-index: 1000;
            background: rgba(255, 255, 255, 0.98); padding: 12px 14px; border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.35); font-size: 12px; width: 275px;
            pointer-events: auto; max-height: 42vh; overflow-y: auto;
            border: 1px solid #cbd5e1; transition: all 0.25s ease;
        }
        .risk-explain-box.expanded {
            width: 80vw; max-width: 550px; max-height: 80vh; bottom: 20px; right: 20px; z-index: 2000; font-size: 14px;
        }
        .risk-explain-title { font-weight: bold; margin-bottom: 6px; border-bottom: 1px solid #cbd5e1; padding-bottom: 4px; font-size: 13.5px; color: #0f172a; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .risk-explain-box.expanded .risk-explain-title { font-size: 16px; }
        .explain-item { margin-bottom: 6px; padding: 6px; border-radius: 6px; cursor: pointer; transition: background 0.2s; border: 1px solid #e2e8f0; background: #f8fafc; }
        .risk-explain-box.expanded .explain-item { padding: 10px; margin-bottom: 8px; }
        .explain-item:hover { background: #f1f5f9; border-color: #94a3b8; }
        .explain-item b { display: block; color: #0f172a; font-size: 12px; }
        .risk-explain-box.expanded .explain-item b { font-size: 14px; }
        .explain-item span { color: #334155; font-size: 10.5px; display: block; margin-top: 2px; }
        .risk-explain-box.expanded .explain-item span { font-size: 12px; }

        .vector-tip-label {
            background: rgba(2, 132, 199, 0.98); border: 1.5px solid #ffffff; color: #ffffff;
            font-size: 11px; font-weight: bold; padding: 4px 9px; border-radius: 5px;
            white-space: nowrap; box-shadow: 0 3px 8px rgba(0,0,0,0.4); text-align: center;
        }

        .risk-badge-red { background: rgba(220, 38, 38, 0.98); border: 1.5px solid #ffffff; padding: 4px 8px; font-size: 10.5px; font-weight: bold; border-radius: 5px; text-align: center; color: #ffffff; white-space: nowrap; box-shadow: 0 3px 8px rgba(0,0,0,0.4); cursor: pointer; pointer-events: auto; z-index: 500; }
        .risk-badge-purple { background: rgba(124, 58, 237, 0.98); border: 1.5px solid #ffffff; padding: 4px 8px; font-size: 10.5px; font-weight: bold; border-radius: 5px; text-align: center; color: #ffffff; white-space: nowrap; box-shadow: 0 3px 8px rgba(0,0,0,0.4); cursor: pointer; pointer-events: auto; z-index: 500; }
        .risk-badge-blue { background: rgba(2, 132, 199, 0.98); border: 1.5px solid #ffffff; padding: 4px 8px; font-size: 10.5px; font-weight: bold; border-radius: 5px; text-align: center; color: #ffffff; white-space: nowrap; box-shadow: 0 3px 8px rgba(0,0,0,0.4); cursor: pointer; pointer-events: auto; z-index: 500; }
        
        .fault-subtext { font-size: 9px; color: #fdf2f2; font-weight: bold; display: block; }
        .strain-value { font-size: 9px; color: #ffffff; font-weight: bold; display: block; background: rgba(0, 0, 0, 0.25); padding: 1px 3px; border-radius: 3px; margin-top: 2px; }

        @media screen and (max-width: 600px) {
            .risk-table-box { top: auto; bottom: 8px; left: 6px; width: 46%; max-height: 25vh; font-size: 10px; padding: 6px; }
            .info-box { top: 8px; right: 6px; width: 48%; max-height: 35vh; padding: 6px; }
            .risk-explain-box { display: none; }
            #earthquake-data { max-height: 70px; }
        }
    </style>
</head>
<body>

    <div class="risk-table-box" id="tableBox" onclick="toggleExpand('tableBox', event)">
        <div class="risk-table-title"><span>📊 地殻変動・歪み (年間変化)</span><span style="font-size:11px; color:#555;">[クリックで拡大/戻す]</span></div>
        <div id="riskTableContent" onclick="event.stopPropagation()">
            <table class="risk-table" style="margin-top: 4px;">
                <tr><th>エリア</th><th>年間変動・歪み</th><th>垂直移動</th></tr>

                <tr><td>首都直下</td><td><b style="color:#b91c1c;">南東15cm/年</b></td><td>微小沈降</td></tr>

                <tr><td>福井
