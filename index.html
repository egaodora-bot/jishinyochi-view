<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>碧AI | 地殻変動・電磁波モニタリングシステム</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
        }
        /* ヘッダー */
        header {
            background: #1e293b;
            color: #fff;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            position: relative;
            z-index: 1001;
            border-bottom: 1px solid #334155;
        }
        /* システムタイトル共通のスタイル */
        .system-title {
            font-size: 16px;
            font-weight: bold;
            color: #38bdf8;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 3px rgba(56, 189, 248, 0.4), 0 0 10px rgba(56, 189, 248, 0.2);
            display: inline-block;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 13px;
            flex-wrap: wrap;
        }
        /* 地域選択エリア */
        .area-selector-wrapper {
            background: #0f172a;
            border: 2px solid #f97316;
            border-radius: 6px;
            padding: 3px 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 10px rgba(249, 115, 22, 0.3);
        }
        .area-selector-wrapper label {
            font-size: 12px;
            font-weight: bold;
            color: #fb923c;
        }
        .area-selector {
            padding: 4px 6px;
            border-radius: 4px;
            border: none;
            background: #1e293b;
            color: #fff;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        /* マグニチュードフィルター */
        .mag-filter-group {
            display: flex;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 6px;
            overflow: hidden;
        }
        .mag-btn {
            background: transparent;
            border: none;
            color: #e2e8f0;
            padding: 5px 10px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .mag-btn.active {
            background: #0284c7;
            color: #fff;
            font-weight: bold;
        }

        .help-btn {
            background: #0284c7;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        .help-btn:hover {
            background: #0369a1;
        }
        
        /* レイアウト全体 */
        .main-container {
            display: flex;
            height: calc(100vh - 55px);
        }

        /* 左側サイドバー */
        .sidebar {
            width: 390px;
            background: #1e293b;
            padding: 15px;
            box-sizing: border-box;
            border-right: 1px solid #334155;
            overflow-y: auto;
            z-index: 1000;
        }
        .card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 12px;
        }
        .card h3 {
            margin: 0 0 8px 0;
            font-size: 13px;
            color: #38bdf8;
            border-bottom: 1px solid #334155;
            padding-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card p, .card ul {
            margin: 0 0 6px 0;
            font-size: 11.5px;
            color: #f1f5f9; 
            line-height: 1.4;
        }
        .card ul {
            padding-left: 15px;
        }
        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            background: #064e3b;
            color: #34d399;
            margin-bottom: 8px;
        }
        
        /* 直近の地震活動情報枠 */
        .emergency-alert-card {
            background: #1e1b4b;
            border: 1px solid #3730a3;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 12px;
        }
        .emergency-alert-card.alert-active {
            background: #450a0a;
            border: 1px solid #ef4444;
        }
        .emergency-alert-card h3 {
            margin: 0 0 4px 0;
            font-size: 12px;
            color: #a5b4fc;
            border-bottom: 1px solid #312e81;
            padding-bottom: 3px;
        }
        .emergency-alert-card.alert-active h3 {
            color: #fca5a5;
            border-bottom: 1px solid #7f1d1d;
        }
        .info-text-box {
            background: #0f172a;
            border-radius: 4px;
            padding: 6px 8px;
            margin-top: 4px;
            border: 1px solid #3730a3;
            font-size: 11px;
            color: #e2e8f0;
            line-height: 1.4;
            word-break: break-all;
            white-space: pre-line;
        }
        .emergency-alert-card.alert-active .info-text-box {
            border: 1px solid #7f1d1d;
            color: #f87171;
            font-weight: bold;
        }

        .risk-item {
            display: flex;
            justify-content: space-between;
            font-size: 11.5px;
            margin-bottom: 4px;
            border-bottom: 1px dashed #334155;
            padding-bottom: 2px;
            color: #ffffff;
        }
        .risk-level-low { color: #34d399; font-weight: bold; }
        .risk-level-mid { color: #fbbf24; font-weight: bold; }
        .risk-level-high { color: #f87171; font-weight: bold; }

        /* アコーディオンメニュー */
        .accordion-wrapper {
            margin-top: 8px;
            border: 1px solid #334155;
            border-radius: 6px;
            background: #111827;
            overflow: hidden;
        }
        .accordion-header {
            width: 100%;
            background: #1e293b;
            border: none;
            color: #38bdf8;
            padding: 8px 10px;
            font-size: 11.5px;
            font-weight: bold;
            text-align: left;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .accordion-header:hover {
            background: #2563eb;
            color: #ffffff;
        }
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            background: #0f172a;
            padding: 0 10px;
            font-size: 11px;
            color: #cbd5e1;
            line-height: 1.5;
        }
        .accordion-content.open {
            padding: 8px 10px;
            max-height: 350px;
            overflow-y: auto;
        }

        .impact-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 8px 10px;
            margin-top: 8px;
        }
        .impact-box h4 {
            margin: 0 0 4px 0;
            font-size: 11.5px;
            color: #38bdf8;
        }
        .impact-box p {
            color: #f1f5f9;
            margin: 0;
            font-size: 11px;
            line-height: 1.4;
        }
        .level-criteria-desc {
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px dashed #334155;
            font-size: 10.5px;
            line-height: 1.4;
        }

        .footer-credit {
            margin-top: 6px;
            font-size: 10px;
            color: #cbd5e1;
            text-align: right;
            border-top: 1px solid #334155;
            padding-top: 4px;
        }

        /* 右側マップエリア */
        #map {
            flex-grow: 1;
            height: 100%;
            z-index: 1;
        }

        /* モーダル */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
        }
        .modal-box {
            background: #1e293b;
            color: #f8fafc;
            width: 90%;
            max-width: 520px;
            max-height: 8
