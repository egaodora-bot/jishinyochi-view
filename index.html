<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地殻変動・地震モニタリングシステム</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
        }
        /* ヘッダー */
        header {
            background: #1e293b;
            color: #fff;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .system-title {
            font-size: 16px;
            font-weight: bold;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 14px;
        }
        /* エリア選択 */
        .area-selector {
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #cbd5e1;
            font-size: 13px;
        }
        /* メインレイアウト */
        #map {
            width: 100%;
            height: calc(100vh - 50px);
        }
        /* フローティングパネル（情報過多対策として重要情報に絞る） */
        .info-panel {
            position: absolute;
            top: 65px;
            right: 15px;
            width: 300px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 1000;
            font-size: 13px;
        }
        .info-panel h3 {
            margin-top: 0;
            font-size: 14px;
            color: #1e293b;
            border-bottom: 2px solid #3b82f6;
            padding-bottom: 5px;
        }
        /* クレジット表記 */
        .footer-credit {
            margin-top: 10px;
            font-size: 11px;
            color: #64748b;
            text-align: right;
            border-top: 1px solid #e2e8f0;
            padding-top: 5px;
        }
        /* セーフティ注意喚起（赤文字） */
        .safety-notice {
            color: red;
            font-weight: bold;
            font-size: 12px;
            margin-top: 8px;
            line-height: 1.4;
        }
        @media (max-width: 600px) {
            header {
                flex-direction: column;
                align-items: flex-start;
            }
            .header-right {
                width: 100%;
                justify-content: space-between;
            }
            .info-panel {
                width: calc(100% - 30px);
                right: 15px;
                top: auto;
                bottom: 15px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="system-title">地殻変動・電磁波モニタリングシステム</div>
        <div class="header-right">
            <div>
                <label for="targetArea" style="font-size: 12px;">地域設定:</label>
                <select id="targetArea" class="area-selector">
                    <option value="kanto">関東（埼玉・東京・茨城・千葉）</option>
                    <option value="hokkaido">北海道</option>
                    <option value="tohoku">東北</option>
                    <option value="all">全国</option>
                </select>
            </div>
            <div id="live-clock">--:--:--</div>
        </div>
    </header>

    <div id="map"></div>

    <!-- 要点を絞った情報パネル -->
    <div class="info-panel">
        <h3>本日の注目ポイント</h3>
        <p>現在の選択地域における地震・地殻変動の状況をリアルタイムに確認できます。赤丸をクリックすると詳細とメカニズムが表示されます。</p>
        
        <div class="safety-notice">
            ※変動解説や論文に基づくセーフティ対策から心がけて下さい。日頃からの備えを確認しましょう。
        </div>

        <div class="footer-credit">
            by 林 榮一
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 時計のリアルタイム更新
        function updateClock() {
            const now = new Date();
            document.getElementById('live-clock').textContent = now.toLocaleTimeString('ja-JP');
        }
        setInterval(updateClock, 1000);
        updateClock();

        // マップの初期化（中心：関東・日本周辺）
        const map = L.map('map').setView([36.2048, 138.2529], 6);

        // 地理院地図タイル
        L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院</a>',
            maxZoom: 18
        }).addTo(map);

        // 1. 主要境界構造線を細く上品に描画するサンプル
        // （本来の構造線データに置き換えてご利用いただけます）
        const faultLine = [
            [35.0, 138.0],
            [36.0, 139.0],
            [37.0, 140.0]
        ];
        L.polyline(faultLine, {
            color: '#dc2626',
            weight: 1.5, // 以前より細く調整
            opacity: 0.6
        }).addTo(map).bindPopup("主要境界構造線（細線化対応）");

        // 4. サンプル震源（クリックでメカニズム解説を表示）
        const sampleEarthquake = L.circleMarker([35.6895, 139.6917], {
            radius: 8,
            color: '#ef4444',
            fillColor: '#ef4444',
            fillOpacity: 0.7
        }).addTo(map);

        sampleEarthquake.bindPopup(`
            <strong>地震情報（サンプル）</strong><br>
            発生時間: 15:00頃<br>
            規模: M 4.2 / 最大震度: 3<br>
            <hr style="margin: 5px 0;">
            <strong>【なぜ起きたのか（メカニズム解説）】</strong><br>
            この地震はプレート境界付近のひずみが解放されて起きたものです。地殻変動データや電磁波の観測とあわせて、今後の余震リスクにご注意ください。
        `);

        // 地域設定の切り替え連動（簡易サンプル）
        document.getElementById('targetArea').addEventListener('change', (e) => {
            const area = e.target.value;
            if (area === 'kanto') {
                map.setView([35.8, 139.5], 8);
            } else if (area === 'hokkaido') {
                map.setView([43.0, 142.0], 7);
            } else if (area === 'tohoku') {
                map.setView([39.0, 141.0], 7);
            } else {
                map.setView([36.2, 138.2], 6);
            }
        });
    </script>
</body>
</html>
