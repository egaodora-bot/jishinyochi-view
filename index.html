<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚠️自然災害RISK（地図確実表示・完全安定版）</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
        }
        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: linear-gradient(135deg, #450a0a 0%, #1e1b4b 100%);
            color: #fff;
            padding: 0 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ef4444;
            box-sizing: border-box;
            z-index: 2000;
        }
        .system-title {
            font-size: 14px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 4px rgba(239, 68, 68, 0.8);
            white-space: nowrap;
        }
        .header-center {
            display: flex;
            gap: 6px;
            background: #180808;
            padding: 3px;
            border-radius: 8px;
            border: 1px solid #7f1d1d;
        }
        .mode-btn {
            background: transparent;
            border: none;
            color: #cbd5e1;
            padding: 5px 10px;
            font-size: 11.5px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
        }
        .mode-btn.active {
            background: #dc2626;
            color: #fff;
            box-shadow: 0 2px 6px rgba(220, 38, 38, 0.5);
        }
        .radar-btn {
            background: #334155;
            color: #94a3b8;
            border: 1px solid #475569;
            padding: 5px 12px;
            font-size: 11.5px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
        }
        .radar-btn.active {
            background: #0284c7;
            color: #ffffff;
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.9);
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }
        .area-selector-wrapper {
            background: #180808;
            border: 2px solid #ef4444;
            border-radius: 6px;
            padding: 2px 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .area-selector-wrapper label {
            font-size: 11px;
            font-weight: bold;
            color: #fca5a5;
        }
        .area-selector {
            padding: 3px 4px;
            border-radius: 4px;
            border: none;
            background: #2a0808;
            color: #fff;
            font-size: 11.5px;
            font-weight: bold;
            cursor: pointer;
        }
        .mag-filter-group {
            display: flex;
            background: #180808;
            border: 1px solid #7f1d1d;
            border-radius: 6px;
            overflow: hidden;
        }
        .mag-btn {
            background: transparent;
            border: none;
            color: #e2e8f0;
            padding: 4px 7px;
            font-size: 11px;
            cursor: pointer;
        }
        .mag-btn.active {
            background: #0284c7;
            color: #fff;
            font-weight: bold;
        }

        .main-container {
            position: absolute;
            top: 60px;
            left: 0;
            width: 100vw;
            height: calc(100vh - 60px);
            display: flex;
        }
        .sidebar {
            width: 380px;
            height: 100%;
            background: #1e1b4b;
            padding: 12px;
            box-sizing: border-box;
            border-right: 1px solid #7f1d1d;
            overflow-y: auto;
            flex-shrink: 0;
            z-index: 1000;
        }
        #map {
            position: relative;
            flex-grow: 1;
            height: 100%;
            background-color: #0f172a;
        }
        .card {
            background: #0f172a;
            border: 1px solid #7f1d1d;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 10px;
        }
        .card h3 {
            margin: 0 0 6px 0;
            font-size: 12px;
            color: #ffffff;
            border-bottom: 1px solid #7f1d1d;
            padding-bottom: 4px;
        }
        .status-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            background: #065f46;
            color: #ffffff;
            margin-bottom: 6px;
            border: 1px solid #059669;
        }
        .emergency-alert-card {
            background: #450a0a;
            border: 1px solid #f87171;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 10px;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.3);
        }
        .emergency-alert-card h3 {
            margin: 0 0 4px 0;
            font-size: 12px;
            color: #ffffff;
            border-bottom: 1px solid #991b1b;
            padding-bottom: 3px;
        }
        .info-text-box {
            background: #0f172a;
            border-radius: 4px;
            padding: 6px;
            margin-top: 4px;
            border: 1px solid #7f1d1d;
            font-size: 11px;
            color: #fecaca;
            white-space: pre-line;
        }
        .quake-list-container {
            max-height: 200px;
            overflow-y: auto;
            background: #0f172a;
            border: 1px solid #7f1d1d;
            border-radius: 6px;
            padding: 4px;
        }
        .quake-item {
            font-size: 10.5px;
            padding: 5px 6px;
            border-bottom: 1px dashed #334155;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .quake-item:hover {
            background: #1e293b;
        }
        .quake-item:last-child {
            border-bottom: none;
        }
        .risk-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            margin-bottom: 4px;
            border-bottom: 1px dashed #7f1d1d;
            padding-bottom: 3px;
        }
        .risk-level-low { color: #34d399; font-weight: bold; }
        .risk-level-mid { color: #fbbf24; font-weight: bold; }
        .risk-level-high { color: #f87171; font-weight: bold; }

        .mode-section { display: none; }
        .mode-section.active { display: block; }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column-reverse;
            }
            .sidebar {
                width: 100%;
                height: 45%;
            }
            #map {
                width: 100%;
                height: 55%;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="system-title">地殻変動地震リスク危機管理リアル情報</div>
        
        <div class="header-center">
            <button id="btnEarthquakeMode" class="mode-btn active" onclick="switchMode('earthquake')">🌋 地震モード</button>
            <button id="btnWaterMode" class="mode-btn" onclick="switchMode('weather_risk')">🌀 気象・災害RISK</button>
            <button id="btnRadarToggle" class="radar-btn active" onclick="toggleRadar()">🌧️ 雨雲レーダー：ON</button>
        </div>

        <div class="header-right">
            <div class="area-selector-wrapper">
                <label for="targetArea">地域:</label>
                <select id="targetArea" class="area-selector" onchange="updateViewMode()">
                    <option value="all" selected>全国表示</option>
                    <option value="hokkaido">北海道</option>
                    <option value="tohoku">東北</option>
                    <option value="kanto">関東</option>
                    <option value="chubu">中部</option>
                    <option value="kinki">近畿</option>
                    <option value="chugoku_shikoku">中国・四国</option>
                    <option value="kyushu_okinawa">九州・沖縄</option>
                </select>
            </div>
            <div id="magFilterContainer" class="mag-filter-group">
                <button class="mag-btn active" onclick="setMagFilter('all', this)">全て</button>
                <button class="mag-btn" onclick="setMagFilter('4', this)">M4+</button>
                <button class="mag-btn" onclick="setMagFilter('5', this)">M5+</button>
            </div>
            <div id="live-clock" style="font-size: 11px; font-family: monospace; color: #fca5a5;">14:00:00</div>
        </div>
    </header>

    <div class="main-container">
        <div class="sidebar">
            <div class="card">
                <div class="status-badge" id="apiStatus">安定稼働中（ローカルモード）</div>
                <p id="modeStatusDesc">最新の災害データを安定表示しています。</p>
            </div>

            <!-- 🌋 地震モード専用セクション -->
            <div id="earthquakeSection" class="mode-section active">
                <div class="emergency-alert-card alert-active">
                    <h3>直近の地震活動情報</h3>
                    <div class="info-text-box">【直近の検知】
発生時刻: 2026-10-26 13:37:00
震源地: 千葉県北東部
規模: M3.1 / 深さ: 40km</div>
                </div>

                <div class="card" style="border-color: #38bdf8;">
                    <h3 style="color: #38bdf8; display: flex; justify-content: space-between; align-items: center;">
                        <span>📊 直近の地震発生一覧 (地図連動)</span>
                        <span style="font-size: 9.5px; color: #94a3b8;" id="quakeCountBadge">7件</span>
                    </h3>
                    <div class="quake-list-container" id="quakeListContainer"></div>
                </div>

                <div class="card" style="border: 1px solid #ef4444; background: linear-gradient(135deg, #450a0a 0%, #1e1b4b 100%);">
                    <h3 style="color: #ffffff;">⚡ 電磁波・地殻ひずみ異常検知速報</h3>
                    <div style="font-size: 11px; line-height: 1.4; color: #f8fafc;">
                        <p style="margin: 0 0 4px 0; color: #fca5a5; font-weight: bold;">【現在地図上で注目している異常エリア】</p>
