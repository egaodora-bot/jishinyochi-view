<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地殻変動・電磁波モニタリング防災システム</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #0b0f19;
            color: #e2e8f0;
        }
        #app {
            display: flex;
            width: 100vw;
            height: 100vh;
        }
        /* 左側：インデントとカメラ部分を考慮したエリア */
        .sidebar {
            width: 380px;
            background: rgba(15, 23, 42, 0.9);
            border-right: 1px solid #1e293b;
            display: flex;
            flex-direction: column;
            z-index: 10;
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
            padding-left: env(safe-area-inset-left, 0px);
        }
        .header {
            padding: 20px;
            border-bottom: 1px solid #1e293b;
        }
        .header h1 {
            font-size: 1.1rem;
            margin: 0 0 5px 0;
            color: #38bdf8;
            letter-spacing: 0.05em;
        }
        .header p {
            font-size: 0.8rem;
            color: #94a3b8;
            margin: 0;
        }
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        /* 右側：固定エリア（マップや詳細ビジュアル） */
        .main-display {
            flex: 1;
            position: relative;
            background: #020617;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .placeholder-box {
            text-align: center;
            color: #64748b;
        }
        .card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .card h3 {
            margin-top: 0;
            font-size: 0.95rem;
            color: #f8fafc;
        }
        .status-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            background: #065f46;
            color: #34d399;
        }
        /* フィルター用の簡易フォームスタイル */
        .filter-group {
            margin-bottom: 10px;
        }
        .filter-group label {
            display: block;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 4px;
        }
        .filter-group select, .filter-group input {
            width: 100%;
            padding: 8px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 4px;
            color: #f8fafc;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- 左側コントロール・情報パネル -->
        <div class="sidebar">
            <div class="header">
                <h1>地殻変動・電磁波モニタリング</h1>
                <p>Realtime Crustal & EM System</p>
            </div>
            <div class="content-area">
                <!-- 最上部に移動した「ぐにちゅーどフィルター」設定エリア -->
                <div class="card" style="border-color: #38bdf8;">
                    <h3>ぐにちゅーどフィルター設定</h3>
                    <div class="filter-group" style="margin-top: 10px;">
                        <label for="target-region">監視エリア / 座標系</label>
                        <select id="target-region">
                            <option value="all">全国一括監視</option>
                            <option value="kanto" selected>関東圏 (首都圏・茨城周辺)</option>
                            <option value="tokai">東海・南海トラフ沿い</option>
                            <option value="tohoku">東北沖・日本海溝</option>
                            <option value="custom">カスタム緯度・経度指定</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="radius-range">半径レンジ (km)</label>
                        <input type="range" id="radius-range" min="10" max="300" value="100" style="width: 100%; accent-color: #38bdf8;">
                    </div>
                </div>

                <div class="card">
                    <h3>システムステータス</h3>
                    <span class="status-badge">正常稼働中</span>
                    <p style="font-size: 0.85rem; margin-top: 10px; color: #cbd5e1;">
                        P2P地震情報および各観測拠点のデータをリアルタイムで解析・同期しています。
                    </p>
                </div>

                <div class="card">
                    <h3>直近の観測トピックス</h3>
                    <p style="font-size: 0.85rem; color: #94a3b8;">
                        現在、特異変動の監視を継続中です。詳細なデータは右側のビューに反映されます。
                    </p>
                </div>
            </div>
        </div>

        <!-- 右側メインディスプレイ（固定ビュー） -->
        <div class="main-display">
            <div class="placeholder-box">
                <h2>ビジュアル・マップレンダリングエリア</h2>
                <p>ここにリアルタイムの変動マップやグラフが表示されます。</p>
            </div>
        </div>
    </div>
</body>
</html>
