<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var isMobile = window.innerWidth < 768;
        var initialZoom = isMobile ? 4 : 5;
        
        var map = L.map('map', {
            scrollWheelZoom: true,
            wheelPxPerZoomLevel: 160
        }).setView([37.5, 138.0], initialZoom);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap & J-SHIS & GSI'
        }).addTo(map);

        var tectonicLines = [
            { name: '日本海溝・千島海溝', color: '#002244', weight: 3.5, dashArray: '5, 5', latlngs: [[45.0, 148.0], [41.0, 144.5], [37.0, 142.5], [35.0, 142.0]] },
            { name: '南海トラフ', color: '#002244', weight: 3.5, dashArray: '5, 5', latlngs: [[34.0, 138.0], [32.5, 134.0], [31.8, 132.0]] },
            { name: '糸魚川静岡構造線', color: '#003366', weight: 3, dashArray: null, latlngs: [[37.1, 137.9], [36.0, 138.1], [35.1, 138.4]] }
        ];

        tectonicLines.forEach(function(l) {
            L.polyline(l.latlngs, { color: l.color, weight: l.weight, dashArray: l.dashArray })
             .addTo(map).bindPopup(`<b style="font-size:12px;">${l.name}</b> (タップで詳細)`);
        });

        var futureRiskAreas = [
            { lat: 33.5, lon: 134.5, baseRadius: 120000, name: '南海トラフ', fault: '南海トラフ巨大地震モデル', prob: '70〜80%', rate: 80, ground: '沿岸沈降・水圧上昇', strain: 'GEONET水平変位: 3.2cm/年', source: '防災科研 J-SHIS / 国土地理院', color: '#ff4d4d', anim: 'animated-red', badgeClass: 'risk-badge', guideClass: 'tap-guide-badge', intensityFactor: 1.1 },
            { lat: 35.68, lon: 139.69, baseRadius: 55000, name: '首都直下', fault: '立川断層帯 / 首都圏直下', prob: '約70%', rate: 70, ground: '電離圏TEC・地下水圧', strain: 'TEC電子数異常: 動的検知中', source: 'GEONET / 電離圏前兆モニタ', color: '#ff4d4d', anim: 'animated-red', badgeClass: 'risk-badge', guideClass: 'tap-guide-badge', intensityFactor: 1.25 },
            { lat: 41.5, lon: 143.5, baseRadius: 100000, name: '千島海溝', fault: '千島海溝プレート境界', prob: '80%以上', rate: 85, ground: '沿岸隆起・変動', strain: 'プレート収束: 8.1cm/年', source: 'J-SHIS プレート収束モデル', color: '#ff4d4d', anim: 'animated-red', badgeClass: 'risk-badge', guideClass: 'tap-guide-badge', intensityFactor: 1.05 },
            { lat: 36.0, lon: 137.8, baseRadius: 70000, name: '中部変動帯', fault: '糸静線・ひずみ集中帯', prob: '変動活発', rate: 60, ground: '山岳隆起・地殻変動', strain: 'GEONETひずみ: 0.15過剰', source: '国土地理院 GEONET解析', color: '#800080', anim: 'animated-purple', badgeClass: 'risk-badge-purple', guideClass: 'tap-guide-purple', intensityFactor: 1.15 }
        ];

        futureRiskAreas.forEach(function(a) {
            var dynamicRadius = a.baseRadius * a.intensityFactor;
            var dynamicOpacity = 0.2 + (a.intensityFactor - 1.0) * 0.4;

            var circle = L.circle([a.lat, a.lon], {
                color: a.color, fillColor: a.color, fillOpacity: dynamicOpacity, radius: dynamicRadius, className: a.anim
            }).addTo(map);

            circle.bindPopup(`
                <b style="font-size:13px;">⚠️ ${a.name}</b><br><br>
                📍 断層: ${a.fault}<br>
                ⏳ 30年確率: <b>${a.prob}</b><br>
                🌊 地盤特性: ${a.ground}<br>
                📐 変動・電磁波: <span style="color:#800080; font-weight:bold;">${a.strain}</span><br>
                <span style="font-size:9px; color:#555;">🔗 データ元: ${a.source}</span>
                <div class="risk-bar-container">
                    <div class="risk-bar-label"><span>ハザード指数 (動的連動)</span><span>${a.prob}</span></div>
                    <div class="risk-bar-bg"><div class="risk-bar-fill" style="width:${a.rate}%; background:${a.color};"></div></div>
                </div>
            `);

            var iconHtml = isMobile 
                ? `<div class="${a.guideClass}">👆 ${a.name} (詳細)</div>` 
                : `<div class="${a.badgeClass}">${a.name}<span class="fault-subtext">👆 タップで詳細表示</span><span class="strain-value">📐 ${a.strain}</span></div>`;
            
            var iconSize = isMobile ? [105, 22] : [120, 50];
            var iconAnchor = isMobile ? [52, 11] : [60, 25];

            L.marker([a.lat, a.lon], {
                icon: L.divIcon({ 
                    className: '', 
                    html: iconHtml,
                    iconSize: iconSize,
                    iconAnchor: iconAnchor
                })
            }).addTo(map);
        });

        var vectorMarkers = [
            { lat: 34.0, lon: 135.0, text: '➔ 3.2cm/y' },
            { lat: 35.5, lon: 138.5, text: '↗ 1.5cm/y' },
            { lat: 40.0, lon: 142.0, text: '⬅ 8.1cm/y' }
        ];
        vectorMarkers.forEach(function(v) {
            L.marker([v.lat, v.lon], {
                icon: L.divIcon({
                    className: '',
                    html: `<div style="background:rgba(128,0,128,0.85); color:#fff; font-size:8px; padding:1px 3px; border-radius:3px; font-weight:bold; white-space:nowrap;">${v.text}</div>`,
                    iconSize: [45, 14],
                    iconAnchor: [22, 7]
                })
            }).addTo(map);
        });

        // 🛡️【ダブル抑制システムの設定】
        var lastNotifiedId = localStorage.getItem('lastNotifiedEqId') || "";
        var lastNotifiedTime = parseInt(localStorage.getItem('lastNotifiedTime') || "0", 10);
        var COOLDOWN_TIME = 30 * 60 * 1000; // ① クールタイム: 30分間は連続通知しない
        var MIN_MAGNITUDE = 4.0;            // ② 規模の足切り: M4.0未満は通知しない

        function sendLineNotification(eqId, eqText, mag) {
            var now = Date.now();

            // 対策1: すでに通知したことがある地震IDならここで完全にブロック（重複防止）
            if (eqId === lastNotifiedId) {
                console.log("【抑制】すでに通知済みの地震のためスキップ:", eqId);
                return;
            }

            // 対策2: 前回の通知から30分経っていなければここでブロック（頻度制限）
            if (now - lastNotifiedTime < COOLDOWN_TIME) {
                console.log("【抑制】クールタイム中のため通知を見送ります");
                return;
            }

            // 対策3: マグニチュードが4.0未満なら通知しない（小規模除外）
            if (mag && parseFloat(mag) < MIN_MAGNITUDE) {
                console.log("【抑制】設定規模未満のためスキップ: M" + mag);
                return;
            }

            var gasUrl = "https://script.google.com/macros/s/AKfycbztLM_LX4qZWjk3eivQplZVj6GTSw2ogTzQ6j0GtjyMsq9uiBZh4FIf6YKFKr8MUGfDmQ/exec"; 
            var alertMessage = `🚨【地震速報・前兆監視】\n新しい地震を検知しました。\n\n${eqText} (M${mag})\n\nマップを確認してください。`;
            
            fetch(gasUrl, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: alertMessage })
            }).then(() => {
                console.log("LINE通知送信成功・記録を保存:", eqId);
                // 送信に成功したら、IDと時間をしっかりと記録・記憶させる
                lastNotifiedId = eqId;
                lastNotifiedTime = now;
                localStorage.setItem('lastNotifiedEqId', eqId);
                localStorage.setItem('lastNotifiedTime', now);
            }).catch(err => {
                console.error("LINE通知エラー:", err);
            });
        }

        var eqLayer = L.layerGroup().addTo(map);
        async function fetchEq() {
            eqLayer.clearLayers();
            try {
                let res = await fetch('https://www.jma.go.jp/bosai/quake/data/list.json');
                let data = await res.json();
                let html = "";
                
                for(let i=0; i<Math.min(2, data.length); i++) {
                    let eq = data[i];
                    
                    let displayName = eq.anm || eq.text || "震源情報";
                    let eqId = eq.code || (eq.at + "_" + displayName); // 地震ごとの固有ID
                    let mag = eq.mag || "0";

                    html += `<div class="eq-item"><span class="eq-time">🕒 ${eq.at}</span><br><span class="eq-desc">${displayName} (M${mag})</span></div>`;
                    
                    // 💡 最新の地震（i === 0）のみ、ダブルの抑制判定に通す
                    if (i === 0) {
                        sendLineNotification(eqId, displayName, mag);
                    }

                    var lat = 35.68, lon = 139.69;
                    if(i===1) { lat = 38.2, lon = 140.8; }

                    L.circleMarker([lat, lon], { radius: 10, color: '#00ffff', fillColor: '#00ffff', fillOpacity: 0.5, className: 'animated-blue-blink' }).addTo(eqLayer);
                    L.circleMarker([lat, lon], { radius: 5, color: '#fff', fillColor: '#00ffff', fillOpacity: 1 }).addTo(eqLayer)
                     .bindPopup(`<b>🔵 最新の地震</b><br>規模: M${mag}<br>${displayName}<br>${eq.at}`);
                }
                document.getElementById('earthquake-data').innerHTML = html;
                let d = new Date();
                document.getElementById('update-time').innerText = "最終更新: " + d.getHours() + ":" + String(d.getMinutes()).padStart(2,'0');
            } catch(e) {
                document.getElementById('earthquake-data').innerHTML = "取得失敗";
            }
        }
        fetchEq();
        setInterval(fetchEq, 60000);
    </script>
