<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌋 総合地震・気象リスクモニタリングシステム</title>
    <!-- Leaflet CSS読み込み -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* 画面レイアウトの基本設定：全画面固定・スクロール防止 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
        }

        /* ヘッダーデザイン：緊急災害カラー（赤紫〜ダークネイビー） */
        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: linear-gradient(135deg, #450a0a 0%, #1e1b4b 100%);
            color: #fff;
            padding: 0 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ef4444;
            box-sizing: border-box;
            z-index: 2000;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .system-title {
            font-size: 15px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 4px rgba(239, 68, 68, 0.8);
            white-space: nowrap;
        }

        /* モード切替ボタングループ */
        .header-center {
            display: flex;
            gap: 6px;
            background: #180808;
            padding: 3px;
            border-radius: 8px;
            border: 1px solid #7f1d1d;
        }

        .mode-btn {
            background: transparent;
            border: none;
            color: #cbd5e1;
            padding: 5px 12px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: #dc2626;
            color: #fff;
            box-shadow: 0 2px 6px rgba(220, 38, 38, 0.5);
        }

        .radar-btn {
            background: #334155;
            color: #94a3b8;
            border: 1px solid #475569;
            padding: 5px 12px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .radar-btn.active {
            background: #0284c7;
            color: #ffffff;
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.9);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 地域フィルターセレクトボックス */
        .area-selector-wrapper {
            background: #180808;
            border: 2px solid #ef4444;
            border-radius: 6px;
            padding: 2px 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .area-selector-wrapper label {
            font-size: 11px;
            font-weight: bold;
            color: #fca5a5;
        }

        .area-selector {
            padding: 3px 4px;
            border-radius: 4px;
            border: none;
            background: #2a0808;
            color: #fff;
            font-size: 11.5px;
            font-weight: bold;
            cursor: pointer;
        }

        /* 規模（マグニチュード）フィルターボタン */
        .mag-filter-group {
            display: flex;
            background: #180808;
            border: 1px solid #7f1d1d;
            border-radius: 6px;
            overflow: hidden;
        }

        .mag-btn {
            background: transparent;
            border: none;
            color: #e2e8f0;
            padding: 4px 7px;
            font-size: 11px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .mag-btn.active {
            background: #0284c7;
            color: #fff;
            font-weight: bold;
        }

        .refresh-sync-btn {
            background: #065f46;
            color: #fff;
            border: 1px solid #059669;
            padding: 5px 10px;
            font-size: 11.5px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .refresh-sync-btn:hover {
            background: #047857;
        }

        /* メインコンテンツ配置（左側サイドバー ＋ 右側マップ） */
        .main-container {
            position: absolute;
            top: 60px;
            left: 0;
            width: 100vw;
            height: calc(100vh - 60px);
            display: flex;
        }

        .sidebar {
            width: 380px;
            height: 100%;
            background: #1e1b4b;
            padding: 12px;
            box-sizing: border-box;
            border-right: 1px solid #7f1d1d;
            overflow-y: auto;
            flex-shrink: 0;
            z-index: 1000;
        }

        #map {
            position: relative;
            flex-grow: 1;
            height: 100%;
            background-color: #0f172a;
        }

        /* サイドバー内カード共通スタイル */
        .card {
            background: #0f172a;
            border: 1px solid #7f1d1d;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 10px;
        }

        .card h3 {
            margin: 0 0 6px 0;
            font-size: 12px;
            color: #ffffff;
            border-bottom: 1px solid #7f1d1d;
            padding-bottom: 4px;
        }

        .status-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            background: #059669;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .emergency-alert-card {
            background: #380808;
            border: 1.5px solid #f87171;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 10px;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
        }

        .emergency-alert-card h3 {
            margin: 0 0 4px 0;
            font-size: 12px;
            color: #ffffff;
            border-bottom: 1px solid #991b1b;
            padding-bottom: 3px;
        }

        .info-text-box {
            background: #090d16;
            border-radius: 4px;
            padding: 8px;
            margin-top: 6px;
            border: 1px solid #7f1d1d;
            font-size: 11.5px;
            color: #f8fafc;
            white-space: pre-line;
            line-height: 1.5;
        }

        .quake-list-container {
            max-height: 240px;
            overflow-y: auto;
            background: #0f172a;
            border: 1px solid #7f1d1d;
            border-radius: 6px;
            padding: 4px;
        }

        .quake-item {
            font-size: 11px;
            padding: 6px 8px;
            border-bottom: 1px dashed #334155;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.15s;
        }

        .quake-item:hover {
            background: #1e293b;
        }

        .risk-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11.5px;
            margin-bottom: 4px;
            border-bottom: 1px dashed #7f1d1d;
            padding-bottom: 3px;
        }

        .risk-level-low { color: #34d399; font-weight: bold; }
        .risk-level-mid { color: #fbbf24; font-weight: bold; }
        .risk-level-high { color: #f87171; font-weight: bold; }

        @media (max-width: 768px) {
            .main-container { flex-direction: column-reverse; }
            .sidebar { width: 100%; height: 45%; }
            #map { width: 100%; height: 55%; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <div class="system-title">🌋 地震・気象リスクモニタ</div>
        </div>
        
        <div class="header-center">
            <button id="btnEarthquakeMode" class="mode-btn active" onclick="switchMode('earthquake')">🌋 地震・地殻モニタ</button>
            <button id="btnWaterMode" class="mode-btn" onclick="switchMode('weather_risk')">🌀 気象・災害RISK</button>
            <button id="btnRadarToggle" class="radar-btn active" onclick="toggleRadar()">🌧️ 雨雲：ON</button>
        </div>

        <div class="header-right">
            <button class="refresh-sync-btn" onclick="forceSyncEarthquake()">🔄 強制同期</button>
            <div class="area-selector-wrapper">
                <label for="targetArea">地域:</label>
                <select id="targetArea" class="area-selector" onchange="updateViewMode()">
