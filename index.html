<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地殻変動・電磁波リアルタイムモニタリング</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
        }
        header {
            background: #1e293b;
            color: #fff;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            position: relative;
            z-index: 1001;
        }
        .system-title {
            font-size: 15px;
            font-weight: bold;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
        }
        .area-selector {
            padding: 4px 6px;
            border-radius: 4px;
            border: 1px solid #cbd5e1;
            font-size: 12px;
        }
        .refresh-btn {
            background: #10b981;
            color: #fff;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        .refresh-btn:hover {
            background: #059669;
        }
        .help-btn {
            background: #3b82f6;
            color: #fff;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .help-btn:hover {
            background: #2563eb;
        }
        #map {
            width: 100%;
            height: calc(100vh - 50px);
            z-index: 1;
        }
        .info-panel {
            position: absolute;
            top: 65px;
            right: 15px;
            width: 280px;
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            z-index: 1000;
            font-size: 13px;
        }
        .info-panel h3 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: #1e293b;
            border-bottom: 2px solid #3b82f6;
            padding-bottom: 4px;
        }
        .info-panel p {
            margin: 0 0 8px 0;
            line-height: 1.4;
            color: #475569;
        }
        .status-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            background: #e2e8f0;
            color: #475569;
            margin-bottom: 6px;
        }
        .status-badge.live {
            background: #dcfce7;
            color: #166534;
        }
        .safety-notice {
            color: red;
            font-weight: bold;
            font-size: 11px;
            margin-top: 8px;
            line-height: 1.3;
            border-top: 1px dashed #cbd5e1;
            padding-top: 6px;
        }
        .footer-credit {
            margin-top: 8px;
            font-size: 11px;
            color: #64748b;
            text-align: right;
            border-top: 1px solid #e2e8f0;
            padding-top: 4px;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3000;
        }
        .modal-box {
            background: #fff;
            width: 90%;
            max-width: 420px;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: left;
        }
        .modal-box h2 {
            margin-top: 0;
            font-size: 18px;
            color: #1e293b;
        }
        .modal-box p, .modal-box ul {
            font-size: 13px;
            color: #475569;
            line-height: 1.5;
        }
        .modal-close-btn {
            display: block;
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        .modal-close-btn:hover {
            background: #1d4ed8;
        }
        @media (max-width: 600px) {
            header {
                flex-direction: column;
                align-items: flex-start;
            }
            .header-right {
                width: 100%;
                justify-content: space-between;
            }
            .info-panel {
                width: calc(100% - 30px);
                right: 15px;
                top: auto;
                bottom: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- ウェルカムモーダル -->
    <div id="welcomeModal" class="modal-overlay">
        <div class="modal-box">
            <h2>リアルタイム地殻変動モニタリング</h2>
            <p>このシステムは、国内外の実際の地震観測情報（直近の発生履歴）をライブで取得して地図上に反映します。</p>
            <ul>
                <li><strong>実データ取得:</strong> 「更新」ボタンでいつでも最新のライブ情報を再取得できます。</li>
                <li><strong>詳細確認:</strong> 震源マーカーをクリックすると実際の規模や発生時刻を確認できます。</li>
            </ul>
            <button class="modal-close-btn" onclick="closeWelcomeModal()">システムを開始する</button>
        </div>
    </div>

    <!-- ヘッダー -->
    <header>
        <div class="system-title">地殻変動・電磁波モニタリング（Live）</div>
        <div class="header-right">
            <div>
                <label for="targetArea" style="font-size: 11px; color: #94a3b8;">地域:</label>
                <select id="targetArea" class="area-selector">
                    <option value="all">全国表示（全域）</option>
                    <option value="kanto">関東</option>
                    <option value="hokkaido">北海道</option>
                    <option value="tohoku">東北</option>
                    <option value="chubu">中部</option>
                    <option value="kinki">近畿</option>
                    <option value="chugoku_shikoku">中国・四国</option>
                    <option value="kyushu_okinawa">九州・沖縄</option>
                </select>
            </div>
            <button class="refresh-btn" onclick="manualRefresh()">データ更新</button>
            <button class="help-btn" onclick="openWelcomeModal()">使い方</button>
            <div id="live-clock" style="font-size: 12px; font-family: monospace;">--:--:--</div>
        </div>
    </header>

    <!-- マップ -->
    <div id="map"></div>

    <!-- 情報パネル -->
    <div class="info-panel">
        <div id="statusBadge" class="status-badge">ライブデータ接続中...</div>
        <h3 id="panelTitle">全国のモニタリング状況</h3>
        <p id="panelDescription">最新の実際の地震発生履歴を読み込んでいます。</p>
        
        <div class="safety-notice">
            ※リアルタイムの観測データに基づき、日頃からの備えや安全確認を徹底しましょう。
        </div>

        <div class="footer-credit">
            by 林 榮一
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 時計
        function updateClock() {
            const now = new Date();
            document.getElementById('live-clock').textContent = now.toLocaleTimeString('ja-JP');
        }
        setInterval(updateClock, 1000);
        updateClock();

        function closeWelcomeModal() {
            document.getElementById('welcomeModal').style.display = 'none';
        }
        function openWelcomeModal() {
            document.getElementById('welcomeModal').style.display = 'flex';
        }

        // マップ初期化
        const map = L.map('map').setView([36.2, 138.2], 6);

        L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院</a>',
            maxZoom: 18
        }).addTo(map);

        // 主要境界構造線
        L.polyline([[35.0, 138.0], [36.0, 139.0], [37.0, 140.0]], {
            color: '#dc2626',
            weight: 1.5,
            opacity: 0.6
        }).addTo(map).bindPopup("主要境界構造線");

        const markerLayer = L.layerGroup().addTo(map);

        // 各エリアの座標定義
        const areaCoords = {
            all: { center: [36.2, 138.2], zoom: 6, name: "全国のモニタリング状況", desc: "日本全国の最新の実際の地震発生状況です。" },
            kanto: { center: [35.8, 139.5], zoom: 8, name: "関東エリアの状況", desc: "首都圏周辺の実際の地震・観測データです。" },
            hokkaido: { center: [42.8, 143.5], zoom: 7, name: "北海道エリアの状況", desc: "北海道周辺の実際の地震・観測データです。" },
            tohoku: { center: [39.0, 141.0], zoom: 7, name: "東北エリアの状況", desc: "東北地方周辺の実際の地震・観測データです。" },
            chubu: { center: [36.5, 137.0], zoom: 7, name: "中部エリアの状況", desc: "中部地方周辺の実際の地震・観測データです。" },
            kinki: { center: [34.7, 135.5], zoom: 8, name: "近畿エリアの状況", desc: "近畿圏周辺の実際の地震・観測データです。" },
            chugoku_shikoku: { center: [34.0, 133.5], zoom: 7, name: "中国・四国エリアの状況", desc: "中国・四国地方周辺の実際の地震データです。" },
            kyushu_okinawa: { center: [32.5, 130.8], zoom: 7, name: "九州・沖縄エリアの状況", desc: "九州・沖縄周辺の実際の地震データです。" }
        };

        // 実際のライブデータを外部公開APIから直接取得するメイン処理
        async function fetchLiveEarthquakeData() {
            const badge = document.getElementById('statusBadge');
            badge.textContent = "データを取得中...";
            badge.className = "status-badge";

            try {
                // 安全で高頻度に更新される日本の地震履歴API
                const response = await fetch('https://api.p2pquake.net/v2/history?limit=50');
                if (!response.ok) throw new Error('ネットワーク応答がありません');
                
                const data = await response.json();
                markerLayer.clearLayers();
                let count = 0;

                data.forEach(item => {
                    if (item.quake && item.quake.hypocenter) {
                        const hypo = item.quake.hypocenter;
                        const lat = hypo.latitude;
                        const lng = hypo.longitude;
                        const mag = hypo.magnitude;
                        const depth = hypo.depth;
                        const place = hypo.name;
                        const time = item.time;

                        if (lat && lng && lat !== -1 && lng !== -1) {
                            const marker = L.circleMarker([lat, lng], {
                                radius: Math.max(7, mag * 2),
                                color: '#ef4444',
                                fillColor: '#ef4444',
                                fillOpacity: 0.75
                            });

                            marker.bindPopup(`
                                <div style="font-size: 12px;">
                                    <strong>🚨 実際の地震発生情報</strong><hr style="margin:4px 0;">
                                    <strong>震源地:</strong> ${place}<br>
                                    <strong>発生時刻:</strong> ${time}<br>
                                    <strong>規模:</strong> M ${mag} (深さ ${depth}km)<br>
                                    <hr style="margin:4px 0;">
                                    <strong>【モニタリング解説】</strong><br>
                                    直近の実際の地殻変動・プレート活動に伴う観測データです。
                                </div>
                            `);
                            markerLayer.addLayer(marker);
                            count++;
                        }
                    }
                });

                badge.textContent = `ライブ接続成功 (${count件のデータを表示})`;
                badge.className = "status-badge live";
            } catch (error) {
                console.error(error);
                badge.textContent = "ライブデータ取得エラー（再試行してください）";
                badge.className = "status-badge";
            }
        }

        function manualRefresh() {
            fetchLiveEarthquakeData();
        }

        // 地域切り替え
        document.getElementById('targetArea').addEventListener('change', (e) => {
            const key = e.target.value;
            const conf = areaCoords[key];
            if (conf) {
                map.setView(conf.center, conf.zoom);
                document.getElementById('panelTitle').textContent = conf.name;
                document.getElementById('panelDescription').textContent = conf.desc;
            }
        });

        // 起動時に実データを取得
        fetchLiveEarthquakeData();
    </script>
</body>
</html>
