<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地殻変動・電磁波モニタリングシステム</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
        }
        header {
            background: #1e293b;
            color: #fff;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            position: relative;
            z-index: 1001;
        }
        .system-title {
            font-size: 15px;
            font-weight: bold;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
        }
        .area-selector {
            padding: 4px 6px;
            border-radius: 4px;
            border: 1px solid #cbd5e1;
            font-size: 12px;
        }
        .help-btn {
            background: #3b82f6;
            color: #fff;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .help-btn:hover {
            background: #2563eb;
        }
        #map {
            width: 100%;
            height: calc(100vh - 50px);
            z-index: 1;
        }
        .info-panel {
            position: absolute;
            top: 65px;
            right: 15px;
            width: 280px;
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            z-index: 1000;
            font-size: 13px;
        }
        .info-panel h3 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: #1e293b;
            border-bottom: 2px solid #3b82f6;
            padding-bottom: 4px;
        }
        .info-panel p {
            margin: 0 0 8px 0;
            line-height: 1.4;
            color: #475569;
        }
        .status-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            background: #dcfce7;
            color: #166534;
            margin-bottom: 6px;
        }
        .safety-notice {
            color: red;
            font-weight: bold;
            font-size: 11px;
            margin-top: 8px;
            line-height: 1.3;
            border-top: 1px dashed #cbd5e1;
            padding-top: 6px;
        }
        .footer-credit {
            margin-top: 8px;
            font-size: 11px;
            color: #64748b;
            text-align: right;
            border-top: 1px solid #e2e8f0;
            padding-top: 4px;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3000;
        }
        .modal-box {
            background: #fff;
            width: 90%;
            max-width: 420px;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: left;
        }
        .modal-box h2 {
            margin-top: 0;
            font-size: 18px;
            color: #1e293b;
        }
        .modal-box p, .modal-box ul {
            font-size: 13px;
            color: #475569;
            line-height: 1.5;
        }
        .modal-close-btn {
            display: block;
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        .modal-close-btn:hover {
            background: #1d4ed8;
        }
        @media (max-width: 600px) {
            header {
                flex-direction: column;
                align-items: flex-start;
            }
            .header-right {
                width: 100%;
                justify-content: space-between;
            }
            .info-panel {
                width: calc(100% - 30px);
                right: 15px;
                top: auto;
                bottom: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- ウェルカムモーダル -->
    <div id="welcomeModal" class="modal-overlay">
        <div class="modal-box">
            <h2>地殻変動モニタリングシステム</h2>
            <p>全国各地の観測データおよび地震・地殻変動の状況を確認できるシステムです。</p>
            <ul>
                <li><strong>地域選択:</strong> 右上のメニューから地域を選ぶと地図と解説が連動します。</li>
                <li><strong>詳細情報:</strong> マップ上の赤丸をクリックすると発生メカニズムを確認できます。</li>
            </ul>
            <button class="modal-close-btn" onclick="closeWelcomeModal()">システムを開始する</button>
        </div>
    </div>

    <!-- ヘッダー -->
    <header>
        <div class="system-title">地殻変動・電磁波モニタリング</div>
        <div class="header-right">
            <div>
                <label for="targetArea" style="font-size: 11px; color: #94a3b8;">地域:</label>
                <select id="targetArea" class="area-selector">
                    <option value="kanto">関東（埼玉・東京等）</option>
                    <option value="hokkaido">北海道</option>
                    <option value="tohoku">東北</option>
                    <option value="chubu">中部</option>
                    <option value="kinki">近畿（関西）</option>
                    <option value="chugoku_shikoku">中国・四国</option>
                    <option value="kyushu_okinawa">九州・沖縄</option>
                    <option value="all">全国表示</option>
                </select>
            </div>
            <button class="help-btn" onclick="openWelcomeModal()">使い方</button>
            <div id="live-clock" style="font-size: 12px; font-family: monospace;">--:--:--</div>
        </div>
    </header>

    <!-- マップ -->
    <div id="map"></div>

    <!-- 情報パネル -->
    <div class="info-panel">
        <div class="status-badge">システム正常稼働中</div>
        <h3 id="panelTitle">関東エリアの状況</h3>
        <p id="panelDescription">首都圏周辺の観測データと地殻変動状況を表示しています。</p>
        
        <div class="safety-notice">
            ※変動解説に基づくセーフティ対策を心がけ、日頃からの備えを確認しましょう。
        </div>

        <div class="footer-credit">
            by 林 榮一
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 時計
        function updateClock() {
            const now = new Date();
            document.getElementById('live-clock').textContent = now.toLocaleTimeString('ja-JP');
        }
        setInterval(updateClock, 1000);
        updateClock();

        function closeWelcomeModal() {
            document.getElementById('welcomeModal').style.display = 'none';
        }
        function openWelcomeModal() {
            document.getElementById('welcomeModal').style.display = 'flex';
        }

        // マップ初期化
        const map = L.map('map').setView([35.8, 139.5], 8);

        L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院</a>',
            maxZoom: 18
        }).addTo(map);

        // 主要境界構造線
        L.polyline([[35.0, 138.0], [36.0, 139.0], [37.0, 140.0]], {
            color: '#dc2626',
            weight: 1.5,
            opacity: 0.6
        }).addTo(map).bindPopup("主要境界構造線");

        const markerLayer = L.layerGroup().addTo(map);

        // エリアデータ定義（確実な表示データ）
        const areaData = {
            kanto: {
                name: "関東エリアの状況",
                desc: "埼玉・東京・茨城・千葉などの首都圏の観測状況です。",
                center: [35.8, 139.5],
                zoom: 8,
                quakes: [
                    { lat: 35.6895, lng: 139.6917, mag: 4.2, depth: "約50km", title: "首都圏直下の地震", mechanism: "プレート境界付近のひずみ解放に伴うもの。日常の備えを確認しましょう。" }
                ]
            },
            hokkaido: {
                name: "北海道エリアの状況",
                desc: "千島海溝沿いや根室沖など海溝型地震の警戒エリアです。",
                center: [42.8, 143.5],
                zoom: 7,
                quakes: [
                    { lat: 42.9, lng: 144.3, mag: 5.1, depth: "約30km", title: "根室沖周辺の活動", mechanism: "太平洋プレートの沈み込みに伴う地殻変動。" }
                ]
            },
            tohoku: {
                name: "東北エリアの状況",
                desc: "日本海溝周辺における余震や地殻変動のモニタリングです。",
                center: [39.0, 141.0],
                zoom: 7,
                quakes: [
                    { lat: 38.3, lng: 142.8, mag: 4.8, depth: "約40km", title: "日本海溝付近の地震", mechanism: "周辺プレートの継続的なひずみ調整活動。" }
                ]
            },
            chubu: {
                name: "中部エリアの状況",
                desc: "フォッサマグナ周辺の複雑な地殻構造の変動状況です。",
                center: [36.5, 137.0],
                zoom: 7,
                quakes: [
                    { lat: 36.2, lng: 137.9, mag: 3.9, depth: "約10km", title: "中部地方内陸の地震", mechanism: "活断層の活動や局所的なひずみの蓄積。" }
                ]
            },
            kinki: {
                name: "近畿（関西）エリアの状況",
                desc: "活断層が多く存在する近畿圏の活動傾向を確認できます。",
                center: [34.7, 135.5],
                zoom: 8,
                quakes: [
                    { lat: 34.69, lng: 135.5, mag: 3.5, depth: "約15km", title: "近畿圏内陸の地震", mechanism: "周辺活断層帯における微小な地殻変動。" }
                ]
            },
            chugoku_shikoku: {
                name: "中国・四国エリアの状況",
                desc: "南海トラフ想定震源域周辺のひずみ・変動データです。",
                center: [34.0, 133.5],
                zoom: 7,
                quakes: [
                    { lat: 33.5, lng: 133.5, mag: 4.0, depth: "約35km", title: "四国沖の地震", mechanism: "フィリピン海プレートの沈み込みに伴う変動。" }
                ]
            },
            kyushu_okinawa: {
                name: "九州・沖縄エリアの状況",
                desc: "火山活動やプレート沈み込みに伴う地殻変動の状況です。",
                center: [32.5, 130.8],
                zoom: 7,
                quakes: [
                    { lat: 31.9, lng: 130.5, mag: 4.1, depth: "約20km", title: "九州南部周辺の地震", mechanism: "プレート境界および火山フロント周辺の活動。" }
                ]
            },
            all: {
                name: "全国のモニタリング状況",
                desc: "日本全国の広域な地殻変動および地震発生状況です。",
                center: [36.2, 138.2],
                zoom: 6,
                quakes: [
                    { lat: 35.6895, lng: 139.6917, mag: 4.2, depth: "約50km", title: "関東の地震", mechanism: "プレート境界付近のひずみ解放。" },
                    { lat: 42.9, lng: 144.3, mag: 5.1, depth: "約30km", title: "北海道沖の地震", mechanism: "千島海溝沿いのプレート活動。" },
                    { lat: 33.5, lng: 133.5, mag: 4.0, depth: "約35km", title: "四国沖の地震", mechanism: "南海トラフ周辺のひずみ調整。" }
                ]
            }
        };

        // 地域切り替え処理
        function updateArea(key) {
            const selected = areaData[key];
            if (!selected) return;

            map.setView(selected.center, selected.zoom);
            document.getElementById('panelTitle').textContent = selected.name;
            document.getElementById('panelDescription').textContent = selected.desc;

            markerLayer.clearLayers();
            selected.quakes.forEach(q => {
                const marker = L.circleMarker([q.lat, q.lng], {
                    radius: 8,
                    color: '#ef4444',
                    fillColor: '#ef4444',
                    fillOpacity: 0.8
                });

                marker.bindPopup(`
                    <strong>${q.title}</strong><br>
                    規模: M ${q.mag} / 深さ: ${q.depth}<br>
                    <hr style="margin: 5px 0;">
                    <strong>【なぜ起きたのか（メカニズム解説）】</strong><br>
                    ${q.mechanism}
                `);

                markerLayer.addLayer(marker);
            });
        }

        // 初期化
        updateArea('kanto');

        // セレクトボックス変更連動
        document.getElementById('targetArea').addEventListener('change', (e) => {
            updateArea(e.target.value);
        });
    </script>
</body>
</html>
